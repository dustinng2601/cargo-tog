# SonarQube Cloud project binding.
#
# Names the project so a scan does not have to be told which one it belongs to,
# from a terminal or from CI.
sonar.projectKey=dustinng2601_cargo-tog
sonar.organization=dustinng2601

sonar.sources=src
sonar.tests=tests
# Rust also keeps unit tests inside the modules they cover, so those paths are
# named here too — otherwise a test module counts as production code and drags
# the measures with it.
sonar.test.inclusions=tests/**,**/tests.rs,**/*_test.rs
sonar.exclusions=target/**,examples/**,**/*.png,**/*.ico

sonar.sourceEncoding=UTF-8
