# Zero outside cloud: GitHub-hosted compiler objects + registry cache.
# No CARGO_TOG_BUCKET secrets required.

- uses: dustinng2601/cargo-tog/action@main
  with:
    mode: github
    key: test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}
    install-nextest: "true"

