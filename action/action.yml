name: cargo-tog
description: >
  Production Cargo CI cache setup — compiler object cache + registry/git cache
  without uploading target/. Optional nextest install. Configure with CARGO_TOG_*
  secrets for multi-repo remote objects.

branding:
  icon: zap
  color: orange

inputs:
  key:
    description: Registry cache key (include runner.os, arch, target, profile)
    required: false
    default: ""
  shared-key:
    description: Optional registry cache key suffix (e.g. job name)
    required: false
    default: ""
  workspaces:
    description: rust-cache workspaces parameter
    required: false
    default: ". -> target"
  compiler-cache:
    description: Enable cargo-tog compiler object cache
    required: false
    default: "true"
  registry-cache:
    description: Cache crates.io / git downloads (not target/)
    required: false
    default: "true"
  cache-targets:
    description: Upload target/ to GitHub cache (keep false in production)
    required: false
    default: "false"
  install-nextest:
    description: Install cargo-nextest (shares compiler cache with cargo test)
    required: false
    default: "false"
  incremental:
    description: Value for CARGO_INCREMENTAL (0 recommended in CI)
    required: false
    default: "0"
  show-stats:
    description: Print compiler-cache stats at end of job setup
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: cargo-tog environment
      shell: bash
      run: |
        set -euo pipefail
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=${{ inputs.incremental }}" >> "$GITHUB_ENV"

        # Public configuration surface: CARGO_TOG_* only.
        bucket="${CARGO_TOG_BUCKET:-}"
        endpoint="${CARGO_TOG_ENDPOINT:-}"
        region="${CARGO_TOG_REGION:-}"
        key_id="${CARGO_TOG_ACCESS_KEY_ID:-}"
        secret="${CARGO_TOG_SECRET_ACCESS_KEY:-}"

        # Implementation bridge (engine env). Not part of the public contract.
        if [ -n "$bucket" ]; then
          echo "SCCACHE_BUCKET=$bucket" >> "$GITHUB_ENV"
        fi
        if [ -n "$endpoint" ]; then
          echo "SCCACHE_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
        fi
        if [ -n "$region" ]; then
          echo "SCCACHE_REGION=$region" >> "$GITHUB_ENV"
        elif [ -n "$bucket" ]; then
          echo "SCCACHE_REGION=auto" >> "$GITHUB_ENV"
        fi
        if [ -n "$key_id" ]; then
          echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
        fi
        if [ -n "$secret" ]; then
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
        fi

        if [ "${{ inputs.compiler-cache }}" != "true" ]; then
          echo "cargo-tog: compiler-cache disabled (clean-build mode)"
          exit 0
        fi

        if [ -n "$bucket" ]; then
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "cargo-tog: mode=remote-object-store"
        else
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "cargo-tog: mode=github-hosted-objects"
        fi

    - name: Install compiler-cache engine
      if: inputs.compiler-cache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Install cargo-tog-rustc
      if: inputs.compiler-cache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        wrap="${RUNNER_TEMP}/cargo-tog-rustc"
        cat > "$wrap" <<'WRAP'
        #!/usr/bin/env bash
        # cargo-tog public RUSTC_WRAPPER
        set -euo pipefail
        if command -v sccache >/dev/null 2>&1; then
          exec sccache "$@"
        fi
        exec "${RUSTC:-rustc}" "$@"
        WRAP
        chmod +x "$wrap"
        echo "RUSTC_WRAPPER=$wrap" >> "$GITHUB_ENV"
        echo "cargo-tog: RUSTC_WRAPPER=cargo-tog-rustc"

    - name: Restore registry / git cache
      if: inputs.registry-cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        cache-targets: ${{ inputs.cache-targets }}
        cache-bin: false
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.key }}

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
        fallback: none

    - name: Compiler-cache stats
      if: inputs.compiler-cache == 'true' && inputs.show-stats == 'true'
      shell: bash
      run: |
        if command -v sccache >/dev/null 2>&1; then
          sccache --show-stats || true
        fi
