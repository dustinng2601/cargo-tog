name: cargo-tog
description: >
  sccache + Cargo registry/git cache without uploading target/.
  Uses remote S3/R2 sccache when SCCACHE_BUCKET is set; otherwise GHA backend.
  Works with cargo test, cargo nextest, cargo build, cargo bench.

author: cargo-tog

inputs:
  key:
    description: rust-cache key (include runner.os / arch / target / profile)
    required: false
    default: ""
  shared-key:
    description: Optional rust-cache shared-key (job matrix suffix)
    required: false
    default: ""
  workspaces:
    description: rust-cache workspaces parameter
    required: false
    default: ". -> target"
  sccache:
    description: Install sccache and set RUSTC_WRAPPER
    required: false
    default: "true"
  rust-cache:
    description: Cache Cargo registry and git (not target/)
    required: false
    default: "true"
  cache-targets:
    description: Upload target/ to GH cache (keep false when using sccache)
    required: false
    default: "false"
  install-nextest:
    description: Install cargo-nextest via taiki-e/install-action (optional)
    required: false
    default: "false"
  incremental:
    description: Set CARGO_INCREMENTAL (0 recommended in CI for better sccache reuse)
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Cargo / sccache environment
      shell: bash
      run: |
        set -euo pipefail
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        # Smaller artifacts; CI rarely needs full debuginfo.
        echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=${{ inputs.incremental }}" >> "$GITHUB_ENV"

        if [ "${{ inputs.sccache }}" != "true" ]; then
          echo "cargo-tog: sccache disabled"
          exit 0
        fi

        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

        if [ -n "${SCCACHE_BUCKET:-}" ]; then
          # Remote object store — multi-repo / multi-workflow hits.
          # Do not combine with GHA backend.
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          if [ -z "${SCCACHE_REGION:-}" ]; then
            echo "SCCACHE_REGION=auto" >> "$GITHUB_ENV"
          fi
          echo "cargo-tog: remote sccache (SCCACHE_BUCKET set)"
        else
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "cargo-tog: GHA sccache backend (set SCCACHE_BUCKET for shared remote cache)"
        fi

    - name: Install sccache
      if: inputs.sccache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Cache Cargo registry / git
      if: inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        cache-targets: ${{ inputs.cache-targets }}
        cache-bin: false
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.key }}

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
        fallback: none

    - name: sccache stats (start)
      if: inputs.sccache == 'true'
      shell: bash
      run: sccache --show-stats || true
