name: cargo-tog
description: >
  Production Cargo CI cache (macOS/Linux/Windows) — compiler objects + registry,
  no target/ upload. CARGO_TOG_* secrets for multi-repo remote objects.
  Sets RUSTC_WRAPPER to a native cargo-tog-rustc binary.

branding:
  icon: zap
  color: orange

inputs:
  key:
    description: Registry cache key — include runner.os, arch, and target triple
    required: false
    default: ""
  shared-key:
    description: Optional registry cache key suffix
    required: false
    default: ""
  workspaces:
    description: rust-cache workspaces parameter
    required: false
    default: ". -> target"
  compiler-cache:
    description: Enable cargo-tog compiler object cache
    required: false
    default: "true"
  registry-cache:
    description: Cache crates.io / git downloads (not target/)
    required: false
    default: "true"
  cache-targets:
    description: Upload target/ (keep false in production)
    required: false
    default: "false"
  install-nextest:
    description: Install cargo-nextest (same compiler cache)
    required: false
    default: "false"
  incremental:
    description: CARGO_INCREMENTAL value (0 recommended in CI)
    required: false
    default: "0"
  show-stats:
    description: Print compiler-cache engine stats
    required: false
    default: "true"
  install-wrapper:
    description: >
      Build/install native cargo-tog-rustc from this action repo (needs cargo on PATH).
      Set false only if cargo-tog-rustc is already on PATH.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: cargo-tog environment
      shell: bash
      run: |
        set -euo pipefail
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=${{ inputs.incremental }}" >> "$GITHUB_ENV"

        bucket="${CARGO_TOG_BUCKET:-}"
        endpoint="${CARGO_TOG_ENDPOINT:-}"
        region="${CARGO_TOG_REGION:-}"
        key_id="${CARGO_TOG_ACCESS_KEY_ID:-}"
        secret="${CARGO_TOG_SECRET_ACCESS_KEY:-}"

        if [ -n "$bucket" ]; then echo "SCCACHE_BUCKET=$bucket" >> "$GITHUB_ENV"; fi
        if [ -n "$endpoint" ]; then echo "SCCACHE_ENDPOINT=$endpoint" >> "$GITHUB_ENV"; fi
        if [ -n "$region" ]; then echo "SCCACHE_REGION=$region" >> "$GITHUB_ENV"
        elif [ -n "$bucket" ]; then echo "SCCACHE_REGION=auto" >> "$GITHUB_ENV"; fi
        if [ -n "$key_id" ]; then echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"; fi
        if [ -n "$secret" ]; then echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"; fi

        # Platform-default object dir when unset (engine also honors CARGO_TOG_CACHE_DIR)
        if [ -z "${CARGO_TOG_CACHE_DIR:-}" ]; then
          case "$(uname -s 2>/dev/null || echo unknown)" in
            Darwin)
              echo "CARGO_TOG_CACHE_DIR=${HOME}/Library/Caches/cargo-tog" >> "$GITHUB_ENV"
              ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT)
              # GitHub Windows bash: LOCALAPPDATA is set
              echo "CARGO_TOG_CACHE_DIR=${LOCALAPPDATA:-$HOME/AppData/Local}/cargo-tog" >> "$GITHUB_ENV"
              ;;
            *)
              echo "CARGO_TOG_CACHE_DIR=${XDG_CACHE_HOME:-$HOME/.cache}/cargo-tog" >> "$GITHUB_ENV"
              ;;
          esac
        fi

        if [ "${{ inputs.compiler-cache }}" != "true" ]; then
          echo "cargo-tog: compiler-cache disabled (clean-build mode)"
          exit 0
        fi

        if [ -n "$bucket" ]; then
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "cargo-tog: mode=remote-object-store"
        else
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "cargo-tog: mode=github-hosted-objects"
        fi

    - name: Install compiler-cache engine
      if: inputs.compiler-cache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Install native cargo-tog-rustc
      if: inputs.compiler-cache == 'true' && inputs.install-wrapper == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Composite actions: github.action_path is .../action ; repo root is parent.
        ROOT="${{ github.action_path }}/.."
        ROOT="$(cd "$ROOT" && pwd)"
        if [ ! -f "$ROOT/Cargo.toml" ]; then
          echo "cargo-tog: Cargo.toml not found at action root; using engine binary name only"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          exit 0
        fi
        # Needs rustc/cargo already on PATH (install toolchain before this action).
        cargo install --path "$ROOT" --bin cargo-tog-rustc --root "${RUNNER_TEMP}/cargo-tog-prefix" --locked --force
        echo "${RUNNER_TEMP}/cargo-tog-prefix/bin" >> "$GITHUB_PATH"
        # Windows cargo install puts .exe here; name without extension is fine for RUSTC_WRAPPER.
        echo "RUSTC_WRAPPER=cargo-tog-rustc" >> "$GITHUB_ENV"
        echo "cargo-tog: installed native cargo-tog-rustc → RUSTC_WRAPPER"

    - name: Fallback wrapper name if install skipped
      if: inputs.compiler-cache == 'true' && inputs.install-wrapper != 'true'
      shell: bash
      run: |
        if command -v cargo-tog-rustc >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=cargo-tog-rustc" >> "$GITHUB_ENV"
        else
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "cargo-tog: install-wrapper=false and cargo-tog-rustc missing; using engine on PATH"
        fi

    - name: Restore registry / git cache
      if: inputs.registry-cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        cache-targets: ${{ inputs.cache-targets }}
        cache-bin: false
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.key }}

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
        fallback: none

    - name: Compiler-cache stats
      if: inputs.compiler-cache == 'true' && inputs.show-stats == 'true'
      shell: bash
      run: |
        if command -v sccache >/dev/null 2>&1; then
          sccache --show-stats || true
        fi
