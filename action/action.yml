name: cargo-tog
description: >
  cargo-tog CI setup — shared compiler object cache + Cargo registry/git cache,
  without uploading target/. Optional cargo-nextest install.
  Works with cargo test, nextest, build, and bench.

author: cargo-tog

inputs:
  key:
    description: Registry cache key (include runner.os / arch / target / profile)
    required: false
    default: ""
  shared-key:
    description: Optional extra registry cache key suffix
    required: false
    default: ""
  workspaces:
    description: Workspace roots for registry cache layout
    required: false
    default: ". -> target"
  compiler-cache:
    description: Enable cargo-tog compiler object cache (recommended)
    required: false
    default: "true"
  registry-cache:
    description: Cache crates.io / git downloads (not target/)
    required: false
    default: "true"
  cache-targets:
    description: Upload target/ to GitHub cache (keep false with compiler-cache)
    required: false
    default: "false"
  install-nextest:
    description: Install cargo-nextest (uses the same compiler cache)
    required: false
    default: "false"
  incremental:
    description: CARGO_INCREMENTAL (0 recommended in CI)
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: cargo-tog environment
      shell: bash
      run: |
        set -euo pipefail
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=${{ inputs.incremental }}" >> "$GITHUB_ENV"

        # Prefer cargo-tog secret names; accept legacy SCCACHE_* if present.
        bucket="${CARGO_TOG_BUCKET:-${SCCACHE_BUCKET:-}}"
        endpoint="${CARGO_TOG_ENDPOINT:-${SCCACHE_ENDPOINT:-}}"
        region="${CARGO_TOG_REGION:-${SCCACHE_REGION:-}}"
        key_id="${CARGO_TOG_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}"
        secret="${CARGO_TOG_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}"

        if [ -n "$bucket" ]; then
          echo "SCCACHE_BUCKET=$bucket" >> "$GITHUB_ENV"
        fi
        if [ -n "$endpoint" ]; then
          echo "SCCACHE_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
        fi
        if [ -n "$region" ]; then
          echo "SCCACHE_REGION=$region" >> "$GITHUB_ENV"
        elif [ -n "$bucket" ]; then
          echo "SCCACHE_REGION=auto" >> "$GITHUB_ENV"
        fi
        if [ -n "$key_id" ]; then
          echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
        fi
        if [ -n "$secret" ]; then
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
        fi

        if [ "${{ inputs.compiler-cache }}" != "true" ]; then
          echo "cargo-tog: compiler-cache disabled"
          exit 0
        fi

        if [ -n "$bucket" ]; then
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "cargo-tog: remote object cache (CARGO_TOG_BUCKET / bucket set)"
        else
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "cargo-tog: GitHub-hosted object cache (set CARGO_TOG_BUCKET for multi-repo remote)"
        fi

    - name: Install compiler cache engine
      if: inputs.compiler-cache == 'true'
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Install cargo-tog rustc wrapper
      if: inputs.compiler-cache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Public name is cargo-tog; the installed engine binary stays private detail.
        wrap="${RUNNER_TEMP}/cargo-tog-rustc"
        cat > "$wrap" <<'WRAP'
        #!/usr/bin/env bash
        set -euo pipefail
        if command -v sccache >/dev/null 2>&1; then
          exec sccache "$@"
        fi
        exec rustc "$@"
        WRAP
        chmod +x "$wrap"
        echo "RUSTC_WRAPPER=$wrap" >> "$GITHUB_ENV"
        echo "cargo-tog: RUSTC_WRAPPER=cargo-tog-rustc"

    - name: Cache Cargo registry / git
      if: inputs.registry-cache == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        cache-targets: ${{ inputs.cache-targets }}
        cache-bin: false
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.key }}

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
        fallback: none
