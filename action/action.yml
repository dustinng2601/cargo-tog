name: cargo-tog
description: >
  Cargo CI cache for macOS/Linux/Windows. Modes: github (no bucket), local,
  registry-only, remote (bucket), off. Default auto picks github on GHA.

branding:
  icon: zap
  color: orange

inputs:
  mode:
    description: >
      Cache mode: auto | github | local | remote | registry-only | off.
      auto = remote if CARGO_TOG_BUCKET set, else github on GHA, else local.
    required: false
    default: "auto"
  key:
    description: Registry cache key — include runner.os, arch, target
    required: false
    default: ""
  shared-key:
    description: Optional registry cache key suffix
    required: false
    default: ""
  workspaces:
    description: rust-cache workspaces parameter
    required: false
    default: ". -> target"
  cache-targets:
    description: Upload target/ (keep false)
    required: false
    default: "false"
  install-nextest:
    description: Install cargo-nextest
    required: false
    default: "false"
  incremental:
    description: CARGO_INCREMENTAL (0 recommended when using compiler cache)
    required: false
    default: "0"
  show-stats:
    description: Print engine stats when compiler cache is on
    required: false
    default: "true"
  install-wrapper:
    description: Install native cargo-tog-rustc from this repo (needs cargo)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve cargo-tog mode
      id: mode
      shell: bash
      run: |
        set -euo pipefail
        raw="${{ inputs.mode }}"
        raw="$(echo "$raw" | tr '[:upper:]' '[:lower:]')"
        bucket="${CARGO_TOG_BUCKET:-}"

        case "$raw" in
          auto|"")
            if [ -n "$bucket" ]; then mode=remote
            elif [ "${GITHUB_ACTIONS:-}" = "true" ]; then mode=github
            else mode=local
            fi
            ;;
          remote|bucket|s3|r2) mode=remote ;;
          github|gha|actions) mode=github ;;
          local|disk) mode=local ;;
          registry-only|registry|downloads) mode=registry-only ;;
          off|none|disable|disabled) mode=off ;;
          *)
            echo "cargo-tog: unknown mode '$raw' — using auto"
            if [ -n "$bucket" ]; then mode=remote
            elif [ "${GITHUB_ACTIONS:-}" = "true" ]; then mode=github
            else mode=local
            fi
            ;;
        esac

        if [ "$mode" = "remote" ] && [ -z "$bucket" ]; then
          echo "cargo-tog: mode=remote but CARGO_TOG_BUCKET empty → falling back to github"
          mode=github
        fi

        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "CARGO_TOG_MODE=$mode" >> "$GITHUB_ENV"
        echo "cargo-tog: resolved mode=$mode"

    - name: cargo-tog environment
      shell: bash
      run: |
        set -euo pipefail
        mode="${{ steps.mode.outputs.mode }}"
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"

        # Incremental: off when we use a compiler object cache; leave default for registry-only/off
        case "$mode" in
          remote|github|local)
            echo "CARGO_INCREMENTAL=${{ inputs.incremental }}" >> "$GITHUB_ENV"
            ;;
        esac

        # Platform object dir (local + engine disk tier)
        if [ -z "${CARGO_TOG_CACHE_DIR:-}" ]; then
          case "$(uname -s 2>/dev/null || echo unknown)" in
            Darwin) echo "CARGO_TOG_CACHE_DIR=${HOME}/Library/Caches/cargo-tog" >> "$GITHUB_ENV" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT)
              echo "CARGO_TOG_CACHE_DIR=${LOCALAPPDATA:-$HOME/AppData/Local}/cargo-tog" >> "$GITHUB_ENV" ;;
            *) echo "CARGO_TOG_CACHE_DIR=${XDG_CACHE_HOME:-$HOME/.cache}/cargo-tog" >> "$GITHUB_ENV" ;;
          esac
        fi

        case "$mode" in
          remote)
            bucket="${CARGO_TOG_BUCKET:-}"
            endpoint="${CARGO_TOG_ENDPOINT:-}"
            region="${CARGO_TOG_REGION:-}"
            key_id="${CARGO_TOG_ACCESS_KEY_ID:-}"
            secret="${CARGO_TOG_SECRET_ACCESS_KEY:-}"
            echo "SCCACHE_BUCKET=$bucket" >> "$GITHUB_ENV"
            [ -n "$endpoint" ] && echo "SCCACHE_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
            if [ -n "$region" ]; then echo "SCCACHE_REGION=$region" >> "$GITHUB_ENV"
            else echo "SCCACHE_REGION=auto" >> "$GITHUB_ENV"; fi
            [ -n "$key_id" ] && echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
            [ -n "$secret" ] && echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "cargo-tog: remote object store (bucket)"
            ;;
          github)
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "cargo-tog: GitHub-hosted objects (no bucket, no external cloud)"
            ;;
          local)
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            # Explicitly avoid remote if someone left leftover env
            echo "cargo-tog: local disk objects only (CARGO_TOG_CACHE_DIR)"
            ;;
          registry-only)
            echo "cargo-tog: registry/git downloads only (no compiler object cache)"
            ;;
          off)
            echo "cargo-tog: acceleration off"
            ;;
        esac

    - name: Install compiler-cache engine
      if: steps.mode.outputs.mode == 'remote' || steps.mode.outputs.mode == 'github' || steps.mode.outputs.mode == 'local'
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Install native cargo-tog-rustc
      if: >-
        (steps.mode.outputs.mode == 'remote' ||
         steps.mode.outputs.mode == 'github' ||
         steps.mode.outputs.mode == 'local') &&
        inputs.install-wrapper == 'true'
      shell: bash
      run: |
        set -euo pipefail
        ROOT="${{ github.action_path }}/.."
        ROOT="$(cd "$ROOT" && pwd)"
        if [ ! -f "$ROOT/Cargo.toml" ]; then
          echo "cargo-tog: no Cargo.toml beside action — RUSTC_WRAPPER=engine binary"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          exit 0
        fi
        cargo install --path "$ROOT" --bin cargo-tog-rustc --root "${RUNNER_TEMP}/cargo-tog-prefix" --locked --force
        echo "${RUNNER_TEMP}/cargo-tog-prefix/bin" >> "$GITHUB_PATH"
        echo "RUSTC_WRAPPER=cargo-tog-rustc" >> "$GITHUB_ENV"
        echo "cargo-tog: RUSTC_WRAPPER=cargo-tog-rustc"

    - name: Wrapper when install-wrapper=false
      if: >-
        (steps.mode.outputs.mode == 'remote' ||
         steps.mode.outputs.mode == 'github' ||
         steps.mode.outputs.mode == 'local') &&
        inputs.install-wrapper != 'true'
      shell: bash
      run: |
        if command -v cargo-tog-rustc >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=cargo-tog-rustc" >> "$GITHUB_ENV"
        else
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        fi

    - name: Restore registry / git cache
      if: steps.mode.outputs.mode != 'off'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        cache-targets: ${{ inputs.cache-targets }}
        cache-bin: false
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.key }}

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
        fallback: none

    - name: Compiler-cache stats
      if: >-
        inputs.show-stats == 'true' &&
        (steps.mode.outputs.mode == 'remote' ||
         steps.mode.outputs.mode == 'github' ||
         steps.mode.outputs.mode == 'local')
      shell: bash
      run: |
        if command -v sccache >/dev/null 2>&1; then
          sccache --show-stats || true
        fi
