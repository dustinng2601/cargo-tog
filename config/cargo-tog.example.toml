# Example org / multi-project config for cargo-tog.
# Copy to cargo-tog.toml wherever you keep tooling config.

[org]
name = "example-org"
# Optional: path or clone name of the workspace that owns dependency pins.
# master = "my-monorepo"

[cache]
# local | gha | s3  (s3 = any S3-compatible store including R2)
sccache_backend = "local"
# bucket = "my-sccache"
share_target_dir = false

[cache.local]
sccache_dir = "~/.cache/sccache"

# Related trees for dep-drift (optional)
# [[trees]]
# name = "main"
# path = "../my-monorepo"
# kind = "master"
#
# [[trees]]
# name = "service-b"
# path = "../service-b"
# kind = "split"

[ci]
cache_targets = false
cache_bin = false
profile_dev_debug = "0"
cargo_incremental = "0"
