# Enterprise example — copy to cargo-tog.toml and adjust.
# Primary concern: cache policy. Sync section should stay commented unless needed.

[org]
name = "example-corp"
# Label only — not required for caching
# primary_workspace = "platform-monorepo"

[cache]
# Production default: never share target/ across workspaces
share_target_dir = false
# CI recommendation
cargo_incremental = "0"
profile_dev_debug = "0"

[cache.local]
dir = "~/.cache/cargo-tog"

[cache.remote]
# Document which bucket CI uses (actual credentials stay in the secret store)
# bucket = "corp-cargo-tog-prod"
# region = "auto"
# endpoint = "https://xxxx.r2.cloudflarestorage.com"

[ci]
registry_cache = true
compiler_cache = true
cache_targets = false
install_nextest = true

# ---------------------------------------------------------------------------
# ADVANCED ONLY — partial file mirrors. Not required for caching.
# Most organizations should leave this entirely commented out.
# ---------------------------------------------------------------------------
# [[sync.mirrors]]
# name = "optional-split"
# source_root = "../main"
# target_root = "../split"
# files = [
#   ["src/lib.rs", "src/lib.rs"],
# ]
