# Example cargo-tog config — copy to cargo-tog.toml

[org]
name = "example-org"
# Optional label for the tree that owns dependency pins
# master = "main-workspace"

[cache]
# Prefer remote object storage for multi-repo CI; local disk for laptops.
# backend hint only (docs); CI uses env secrets.
share_target_dir = false

[cache.local]
# Used by scripts/cargo-tog-rustc when set via CARGO_TOG_CACHE_DIR
dir = "~/.cache/cargo-tog"

# ---------------------------------------------------------------------------
# Optional CODE sync (partial mirrors). Not required for caching.
# See docs/SYNC.md
# ---------------------------------------------------------------------------
