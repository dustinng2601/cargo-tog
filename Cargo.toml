[package]
name = "cargo-tog"
version = "0.1.0"
edition = "2021"
# Floor is set by the clap 4.6 family (clap/clap_builder/clap_derive/clap_lex),
# which all declare rust-version = "1.85". Verified by the `msrv` CI job.
rust-version = "1.85"
description = "Enterprise Cargo build-cache coordination for monorepos and polyrepos (cross-OS)"
license = "MIT"
repository = "https://github.com/dustinng2601/cargo-tog"
readme = "README.md"
keywords = ["cargo", "cache", "ci", "monorepo", "rustc"]
categories = ["command-line-utilities", "development-tools"]
# Two bins, so `cargo run` needs to be told which one is the CLI. Without this
# every `cargo run -- <cmd>` fails, including the package.json scripts.
default-run = "cargo-tog"

[[bin]]
name = "cargo-tog"
path = "src/main.rs"

[[bin]]
name = "cargo-tog-rustc"
path = "src/bin/cargo_tog_rustc.rs"

[dependencies]
anyhow = "1"
# Only to restore the default SIGPIPE disposition, which std cannot express.
# Already in the tree transitively, so this costs no extra compilation.
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
which = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
