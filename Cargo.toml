[package]
name = "cargo-tog"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Enterprise Cargo build-cache coordination for monorepos and polyrepos"
license = "MIT"
repository = "https://github.com/sd2ek/cargo-tog"
readme = "README.md"
keywords = ["cargo", "cache", "ci", "monorepo", "rustc"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cargo-tog"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
sha2 = "0.10"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
